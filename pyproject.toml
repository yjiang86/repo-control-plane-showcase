[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workflow-control-plane-sample"
version = "0.1.0"
description = "Selected local coordination and checkpoint source sample"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["jsonschema>=4.18", "PyYAML>=6.0"]

[project.scripts]
leasectl = "tools.leasectl.cli:main"
devcheckpointctl = "tools.devcheckpointctl.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*"]
